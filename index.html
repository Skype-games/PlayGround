<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Drift — Dodge &amp; Collect</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #05070a; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    touch-action: none; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; background: #030508;
    box-shadow: 0 0 40px rgba(0,255,255,0.06); border-radius: 8px; }
  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10; }
  .layer > * { pointer-events: auto; }
  h1 { margin: 0 0 10px; font-size: clamp(28px, 8vw, 56px); letter-spacing: 14px; text-transform: uppercase;
    color: #00ffff; text-shadow: 0 0 20px rgba(0,255,255,0.6), 0 0 60px rgba(0,255,255,0.25); }
  p { margin: 0 0 22px; font-size: clamp(14px, 4vw, 20px); color: #cfd8e6; opacity: 0.9; text-align: center; }
  .btn { pointer-events: auto; display: inline-block; padding: 12px 30px; font-size: clamp(16px, 4vw, 20px);
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #000; background: #00ffff;
    border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,255,0.5);
    text-decoration: none; transition: transform .1s, filter .1s; }
  .btn:active { transform: scale(0.96); filter: brightness(1.2); }
  .hint { margin-top: 14px; font-size: clamp(12px, 3vw, 15px); color: #8fb0c6; opacity: 0.85; pointer-events: none; }
  .hud { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 32px); pointer-events: none; z-index: 12; font-variant-numeric: tabular-nums; }
  .hud .stat { font-size: clamp(16px, 4vw, 22px); font-weight: 800; color: #e8f1ff; letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(0,255,255,0.35); }
  .hud .stat b { color: #00ffff; margin-right: 6px; }
  .controls { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px;
    pointer-events: none; z-index: 12; }
  .dpad { pointer-events: auto; display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px);
    gap: 8px; background: rgba(255,255,255,0.06); padding: 8px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(4px); }
  .dpad .btn { grid-column: 2; grid-row: 2; width: 56px; height: 56px; padding: 0; font-size: 24px; line-height: 56px;
    border-radius: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.35); }
  .dpad .btn:active { box-shadow: 0 0 0 rgba(0,0,0,0.35); transform: translateY(4px); }
  .dpad .l { grid-column: 1; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; }
  .dpad .u { grid-column: 2; grid-row: 1; } .dpad .d { grid-column: 2; grid-row: 3; }
  .hide { display: none !important; }
  .overlay-bg { position: absolute; inset: 0; background: rgba(3,5,8,0.75); backdrop-filter: blur(6px); z-index: 9; pointer-events: none; }
  @media (min-width: 768px) { .controls { display: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>

  <div class="hud">
    <div class="stat">SCORE <b id="score">0</b></div>
    <div class="stat">BEST <b id="best">0</b></div>
    <div class="stat">LIVES <b id="lives">3</b></div>
  </div>

  <div class="controls">
    <div class="dpad">
      <div class="btn u" data-dir="up">&#9650;</div>
      <div class="btn l" data-dir="left">&#9664;</div>
      <div class="btn d" data-dir="down">&#9660;</div>
      <div class="btn r" data-dir="right">&#9654;</div>
    </div>
  </div>

  <div class="layer" id="menu">
    <div class="overlay-bg"></div>
    <div>
      <h1>Neon Drift</h1>
      <p>Avoid the red cores. Collect the yellow shards.</p>
      <a class="btn" id="startBtn">Start Game</a>
      <div class="hint">Arrows / WASD to move &nbsp;•&nbsp; Tap or click to begin</div>
    </div>
  </div>

  <div class="layer hide" id="gameover">
    <div class="overlay-bg"></div>
    <div style="text-align:center">
      <h1 style="color:#ff3b3b">Game Over</h1>
      <p id="finalScore">Score: 0</p>
      <p id="bestScore" style="margin-bottom:16px;color:#00ffff">Best: 0</p>
      <a class="btn" id="restartBtn">Play Again</a>
      <div class="hint">Press Space to restart</div>
    </div>
  </div>
</div>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const elScore = document.getElementById('score');
  const elBest = document.getElementById('best');
  const elLives = document.getElementById('lives');
  const elMenu = document.getElementById('menu');
  const elGameOver = document.getElementById('gameover');
  const elFinal = document.getElementById('finalScore');
  const elBestGo = document.getElementById('bestScore');

  // ---------- Audio (Web Audio, user-gesture gated) ----------
  let audioCtx;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, type, duration, vol = 0.06, when = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + duration);
  }
  const sfx = {
    collect: () => tone(900, 'square', 0.08, 0.05),
    hit: () => { tone(120, 'sawtooth', 0.25, 0.07); tone(90, 'sawtooth', 0.25, 0.06, 0.08); },
    gameover: () => { tone(220, 'sawtooth', 0.3, 0.08); tone(150, 'sawtooth', 0.4, 0.08, 0.12); tone(110, 'sawtooth', 0.6, 0.09, 0.28); },
    start: () => tone(600, 'square', 0.1, 0.04),
  };

  // ---------- Game constants ----------
  const W = canvas.width, H = canvas.height;
  const PLAYER_R = 12;
  const PLAYER_SPEED = 6.2;
  const FRICTION = 0.88;
  const INVINCIBLE = 1500; // ms
  const SPAWN_BASE = 700;   // ms between enemy spawns
  const STAR_CHANCE = 0.045;

  // ---------- State ----------
  let state = 'MENU'; // MENU | PLAYING | GAMEOVER
  let score = 0, best = 0, lives = 3;
  let lastTime = 0, spawnTimer = 0, difficulty = 1;
  let particles = [], enemies = [], stars = [];
  let player = { x: W * 0.5, y: H - 70, vx: 0, vy: 0, angle: 0, invincible: 0 };
  let keys = {};

  best = Number(localStorage.getItem('neondrift_best') || 0);
  elBest.textContent = best;

  // ---------- Input ----------
  function setKey(k, v) { keys[k] = v; }
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k)) e.preventDefault();
    setKey(k, true);
    if (state === 'MENU' && k === ' ') { ensureAudio(); startGame(); sfx.start(); }
    if (state === 'GAMEOVER' && k === ' ') { ensureAudio(); startGame(); sfx.start(); }
  }, { passive: false });
  window.addEventListener('keyup', e => setKey(e.key.toLowerCase(), false));

  // Touch D-pad
  const dpadBtns = document.querySelectorAll('.controls .btn');
  function touchBtn(dir, pressed) {
    if (state !== 'PLAYING') return;
    keys['touch_' + dir] = pressed;
  }
  dpadBtns.forEach(btn => {
    const dir = btn.dataset.dir;
    const press = () => touchBtn(dir, true);
    const release = () => touchBtn(dir, false);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('touchstart', e => { e.preventDefault(); press(); }, { passive: false });
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
    btn.addEventListener('touchend', e => { e.preventDefault(); release(); }, { passive: false });
    btn.addEventListener('touchcancel', release);
  });
  // Direct drag-to-move on canvas (mobile friendly)
  canvas.addEventListener('touchstart', e => { e.preventDefault(); ensureAudio(); if (state === 'MENU') startGame(); });
  canvas.addEventListener('touchmove', e => {
    if (state !== 'PLAYING') { e.preventDefault(); return; }
    e.preventDefault();
    const t = e.touches[0], rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
    player.x = (t.clientX - rect.left) * sx;
    player.y = (t.clientY - rect.top) * sy;
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', e => { e.preventDefault(); ensureAudio(); startGame(); sfx.start(); });
  document.getElementById('restartBtn').addEventListener('click', e => { e.preventDefault(); ensureAudio(); startGame(); sfx.start(); });

  // ---------- Entities ----------
  function spawnEnemy() {
    const size = 14 + Math.random() * 14;
    enemies.push({
      x: size + Math.random() * (W - size * 2),
      y: -size - 10,
      vx: (Math.random() - 0.5) * 1.6,
      vy: 2.6 + Math.random() * 2.2 + difficulty,
      size,
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.15
    });
  }
  function spawnStar() {
    if (Math.random() > STAR_CHANCE) return;
    const r = 6 + Math.random() * 4;
    stars.push({
      x: r + Math.random() * (W - r * 2),
      y: -r - 10,
      vy: 2.0 + Math.random() * 1.6 + difficulty * 0.5,
      r,
      phase: Math.random() * Math.PI * 2
    });
  }
  function explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 7,
        vy: (Math.random() - 0.5) * 7,
        life: 0.4 + Math.random() * 0.5,
        maxLife: 1,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }

  // ---------- Core ----------
  function resetPlayer() {
    player.x = W * 0.5;
    player.y = H - 70;
    player.vx = 0; player.vy = 0;
    player.invincible = INVINCIBLE;
  }
  function startGame() {
    state = 'PLAYING';
    score = 0; lives = 3; difficulty = 1;
    spawnTimer = 0; lastTime = performance.now();
    particles = []; enemies = []; stars = [];
    elScore.textContent = '0';
    elLives.textContent = '3';
    elMenu.classList.add('hide');
    elGameOver.classList.add('hide');
    resetPlayer();
    requestAnimationFrame(loop);
  }
  function gameOver() {
    state = 'GAMEOVER';
    cancelAnimationFrame(loop.id);
    if (score > best) { best = score; localStorage.setItem('neondrift_best', String(best)); elBest.textContent = best; }
    elFinal.textContent = 'Score: ' + score;
    elBestGo.textContent = 'Best: ' + best;
    elGameOver.classList.remove('hide');
    sfx.gameover();
  }
  function hurt() {
    if (player.invincible > 0) return;
    lives--;
    elLives.textContent = lives;
    explode(player.x, player.y, '#ff3b3b', 14);
    sfx.hit();
    if (lives <= 0) { gameOver(); } else { resetPlayer(); }
  }

  // ---------- Update / Draw ----------
  function rectIntersect(cx, cy, r, rx, ry, rw, rh) {
    const dx = Math.max(rx, Math.min(cx, rx + rw)) - cx;
    const dy = Math.max(ry, Math.min(cy, ry + rh)) - cy;
    return dx * dx + dy * dy < r * r;
  }

  function drawStarShape(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const aOuter = (i * 2 * Math.PI / 5) - Math.PI / 2;
      const aInner = aOuter + Math.PI / 5;
      const ro = r, ri = r * 0.45;
      ctx.lineTo(Math.cos(aOuter) * ro, Math.sin(aOuter) * ro);
      ctx.lineTo(Math.cos(aInner) * ri, Math.sin(aInner) * ri);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffd93d';
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 14;
    ctx.fill();
    ctx.restore();
  }

  function loop(now) {
    loop.id = requestAnimationFrame(loop);
    const dt = Math.min((now - lastTime) / 16.67, 3);
    lastTime = now;

    // Movement input
    let ax = 0, ay = 0;
    if (keys['arrowleft'] || keys['a'] || keys['touch_left']) ax = -1;
    if (keys['arrowright'] || keys['d'] || keys['touch_right']) ax = 1;
    if (keys['arrowup'] || keys['w'] || keys['touch_up']) ay = -1;
    if (keys['arrowdown'] || keys['s'] || keys['touch_down']) ay = 1;
    const len = Math.hypot(ax, ay);
    if (len > 0) { ax /= len; ay /= len; }
    player.vx += ax * PLAYER_SPEED;
    player.vy += ay * PLAYER_SPEED;
    player.vx *= FRICTION; player.vy *= FRICTION;
    player.x += player.vx; player.y += player.vy;
    player.x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, player.x));
    player.y = Math.max(PLAYER_R, Math.min(H - PLAYER_R, player.y));
    if (player.invincible > 0) player.invincible -= 16.67 * dt;
    player.angle += 0.12 * dt;

    // Spawn timing
    spawnTimer -= 16.67 * dt;
    const spawnRate = Math.max(260, SPAWN_BASE - difficulty * 140);
    if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = spawnRate; }
    if (Math.random() * dt < 0.06) spawnStar();

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.x += e.vx; e.y += e.vy;
      e.angle += e.rotSpeed * dt;
      if (e.vx !== 0) { e.x += e.vx; if (e.x < -e.size || e.x > W + e.size) enemies.splice(i, 1); continue; }
      if (e.y > H + e.size) { enemies.splice(i, 1); score += 1; elScore.textContent = score; continue; }
      // collision with player
      if (player.invincible <= 0) {
        const dx = e.x - player.x, dy = e.y - player.y;
        const min = e.size * 0.55 + PLAYER_R * 0.75;
        if (dx * dx + dy * dy < min * min) hurt();
      }
    }

    // Update stars
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.vy * dt;
      s.phase += 0.12 * dt;
      if (s.y > H + s.r) { stars.splice(i, 1); continue; }
      const dx = s.x - player.x, dy = s.y - player.y;
      if (dx * dx + dy * dy < (s.r + PLAYER_R) * (s.r + PLAYER_R)) {
        stars.splice(i, 1);
        score += 15;
        elScore.textContent = score;
        explode(s.x, s.y, '#ffd93d', 9);
        sfx.collect();
        difficulty += 0.02;
      }
    }

    // Difficulty ramp over time
    difficulty += 0.0003 * dt;

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.life -= 0.018 * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
    }

    // ---------- Draw ----------
    ctx.clearRect(0, 0, W, H);
    // subtle grid / starfield background
    ctx.strokeStyle = 'rgba(0,255,255,0.04)';
    ctx.lineWidth = 1;
    const grid = 40;
    const off = (now * 0.15) % grid;
    for (let g = off - grid; g < H; g += grid) { ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(W, g); ctx.stroke(); }
    for (let g = off - grid; g < W; g += grid) { ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, H); ctx.stroke(); }

    // Enemies
    enemies.forEach(e => {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.angle);
      ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath();
      ctx.moveTo(0, -e.size * 0.9);
      ctx.lineTo(e.size * 0.9, 0);
      ctx.lineTo(0, e.size * 0.9);
      ctx.lineTo(-e.size * 0.9, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // Stars
    stars.forEach(s => {
      const pulse = 0.75 + 0.25 * Math.sin(s.phase);
      ctx.globalAlpha = pulse;
      drawStarShape(s.x, s.y, s.r * pulse);
      ctx.globalAlpha = 1;
    });

    // Player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    const flash = player.invincible > 0 && Math.floor(player.invincible / 60) % 2 === 0;
    if (flash) ctx.globalAlpha = 0.45;
    ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.moveTo(0, -PLAYER_R * 1.3);
    ctx.lineTo(PLAYER_R * 0.9, PLAYER_R * 0.7);
    ctx.lineTo(0, PLAYER_R * 0.25);
    ctx.lineTo(-PLAYER_R * 0.9, PLAYER_R * 0.7);
    ctx.closePath();
    ctx.fill();
    // engine glow
    ctx.fillStyle = '#61d4ff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0, PLAYER_R * 0.55, PLAYER_R * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Particles
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 0;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.globalAlpha = 1;
    });

    // HUD decorative pulse on score already via DOM
  }

  // Handle visibility pause
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'PLAYING') { /* keep running lightly */ }
  });

})();
</script>
</body>
</html>
